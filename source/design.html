#phiz-ba-trilingual #pb-screen{min-height:770px}
#phiz-ba-trilingual .pb-status{padding:16px 28px 11px}
#phiz-ba-trilingual .pb-list-toolbar{display:flex;gap:12px;align-items:center;padding:9px 20px 8px}
#phiz-ba-trilingual .pb-list-toolbar>span{flex:1}
#phiz-ba-trilingual .pb-round-icon{width:38px;height:38px;border-radius:50%;background:var(--pb-soft);display:inline-flex;align-items:center;justify-content:center}
#phiz-ba-trilingual .pb-round-icon svg{width:22px;height:22px}
#phiz-ba-trilingual .pb-round-icon.pb-add{background:var(--pb-brand);color:#fff}
#phiz-ba-trilingual .pb-brandmark{font-size:var(--pb-header-size);font-weight:500;letter-spacing:-1px;color:var(--pb-text);padding:3px 20px 4px;flex:initial}
#phiz-ba-trilingual .pb-search{width:calc(100% - 40px);padding:7px 12px;margin:7px 20px 9px;border-radius:24px;font-size:12px;text-align:left;min-height:34px}
#phiz-ba-trilingual .pb-search svg{width:18px;height:18px}
#phiz-ba-trilingual .pb-list-rows{flex:1}
#phiz-ba-trilingual .pb-row{height:var(--pb-list-height);padding:12px var(--pb-list-inset);gap:var(--pb-list-gap);border:0;background:var(--pb-neutral-a);position:relative}
#phiz-ba-trilingual .pb-row .pb-avatar{width:var(--pb-list-avatar);height:var(--pb-list-avatar);font-size:20px}
#phiz-ba-trilingual .pb-row-name{font-size:var(--pb-name-size);font-weight:500;gap:3px;min-width:0}
#phiz-ba-trilingual .pb-row-preview{font-size:var(--pb-preview-size);line-height:1.35;margin-top:3px;display:flex;align-items:center;gap:4px}
#phiz-ba-trilingual .pb-row-preview svg{width:15px;height:15px}
#phiz-ba-trilingual .pb-row-side{font-size:11px;gap:6px;min-width:32px;align-self:flex-start;padding-top:1px}
#phiz-ba-trilingual .pb-row-indicators{display:flex;align-items:center;gap:4px;min-height:18px}
#phiz-ba-trilingual .pb-row-indicators svg{width:14px;height:14px}
#phiz-ba-trilingual .pb-time-unread{color:var(--pb-brand-strong)}
#phiz-ba-trilingual .pb-unread{width:18px;height:18px;font-size:11px;line-height:18px}
#phiz-ba-trilingual .pb-row-wrap{height:var(--pb-list-height);position:relative;overflow:hidden}
#phiz-ba-trilingual .pb-row-wrap.pinned .pb-row{background:var(--pb-soft)}
#phiz-ba-trilingual .pb-row-underlay{position:absolute;inset:0;background:var(--pb-soft);display:flex;justify-content:space-between}
#phiz-ba-trilingual .pb-swipe-left,#phiz-ba-trilingual .pb-swipe-right{display:flex;height:100%}
#phiz-ba-trilingual .pb-row-underlay button{width:69px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;background:var(--pb-soft)}
#phiz-ba-trilingual .pb-swipe-left button:last-child{background:var(--pb-brand-strong);color:#fff}
#phiz-ba-trilingual .pb-business-main{transition:transform .18s}
#phiz-ba-trilingual .swipe-left .pb-business-main{transform:translateX(-138px)}
#phiz-ba-trilingual .swipe-right .pb-business-main{transform:translateX(138px)}
#phiz-ba-trilingual .pb-row-underlay button{visibility:hidden}
#phiz-ba-trilingual .swipe-left .pb-swipe-left button,#phiz-ba-trilingual .swipe-right .pb-swipe-right button{visibility:visible}
#phiz-ba-trilingual .pb-avatar.biz:after{content:'B';font-size:9px;font-weight:500;line-height:16px;text-align:center;width:18px;height:18px;border-radius:6px;background:var(--pb-brand-strong)}
#phiz-ba-trilingual .pb-sample-avatar.a0{background:light-dark(#e6ddd0,#4d4235);color:light-dark(#6a5136,#e6d4be)}
#phiz-ba-trilingual .pb-sample-avatar.a1{background:light-dark(#e9dfdb,#4c3d38);color:light-dark(#8c6556,#e6b9a5)}
#phiz-ba-trilingual .pb-sample-avatar.a2{background:light-dark(#dce9dd,#374c39);color:light-dark(#47734b,#b3d4b6)}
#phiz-ba-trilingual .pb-sample-avatar.a3{background:light-dark(#eddee9,#493343);color:light-dark(#8d577e,#d9a5cb)}
#phiz-ba-trilingual .pb-sample-avatar.a4{background:light-dark(#e1e4e9,#39414d);color:light-dark(#586a80,#adbbd0)}
#phiz-ba-trilingual .pb-filter{gap:7px;padding:5px 20px 10px;flex-wrap:wrap}
#phiz-ba-trilingual .pb-filter button{padding:4px 11px;font-size:12px;border-radius:18px;background:var(--pb-soft);color:var(--pb-sub)}
#phiz-ba-trilingual .pb-filter button[aria-pressed=true]{background:var(--pb-out);color:var(--pb-brand-strong)}
#phiz-ba-trilingual .pb-archived{display:flex;gap:13px;width:100%;align-items:center;padding:10px 25px;background:var(--pb-soft)}
#phiz-ba-trilingual .pb-archived span{flex:1;text-align:left}
#phiz-ba-trilingual .pb-bottomnav{padding:10px 4px 5px;gap:0}
#phiz-ba-trilingual .pb-bottomnav button{font-size:10px;gap:4px;min-height:43px;padding:0 2px;min-width:0;color:var(--pb-sub)}
#phiz-ba-trilingual .pb-bottomnav button:first-child{color:var(--pb-text)}
#phiz-ba-trilingual .pb-bottomnav button:first-child svg{fill:var(--pb-brand);stroke:var(--pb-brand-strong)}
#phiz-ba-trilingual .pb-chat-name{font-size:16px}
#phiz-ba-trilingual .pb-top>.pb-avatar{width:40px;height:40px;font-size:14px}
#phiz-ba-trilingual .pb-chat-area{background-color:var(--pb-chat);gap:10px}
#phiz-ba-trilingual .pb-identity{display:grid;grid-template-columns:42px 1fr;column-gap:10px;padding:12px;text-align:left;margin:0 3px}
#phiz-ba-trilingual .pb-identity>.pb-avatar{grid-row:1/4;width:42px;height:42px;margin:0}
#phiz-ba-trilingual .pb-identity strong{font-size:13px}
#phiz-ba-trilingual .pb-identity small{margin:3px 0 5px;line-height:1.45}
#phiz-ba-trilingual .pb-identity>button{justify-self:start;padding:3px 0}
#phiz-ba-trilingual .pb-composer{padding:8px;gap:4px}
#phiz-ba-trilingual .pb-inputwrap{background:var(--pb-bg);border-color:light-dark(#d5d5cc,#4a534c);gap:6px;padding:3px 11px}
#phiz-ba-trilingual .pb-inputwrap>.pb-composer-tool{padding:0;display:flex;align-items:center;min-width:19px;min-height:28px}
#phiz-ba-trilingual .pb-composer-tool svg{width:18px;height:18px}
#phiz-ba-trilingual .pb-send{width:36px;min-width:36px;min-height:36px!important}
#phiz-ba-trilingual .pb-review-controls{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
#phiz-ba-trilingual .pb-review-controls button{font-size:11px;background:var(--pb-soft);border-radius:6px;padding:7px 9px;color:var(--pb-sub)}
#phiz-ba-trilingual .pb-note-kicker{font-size:11px;overflow-wrap:anywhere}
#phiz-ba-trilingual .pb-profile-actions .pb-button{border-radius:10px}
#phiz-ba-trilingual .pb-confirm-note{padding:9px 0;font-size:12px;color:var(--pb-sub)}
@media(max-width:620px){#phiz-ba-trilingual .pb-stage{grid-template-columns:minmax(0,1fr)}#phiz-ba-trilingual .pb-preview{margin:auto;width:100%}#phiz-ba-trilingual .pb-inspector{margin-top:12px}}
@media(max-width:360px){#phiz-ba-trilingual{--pb-list-inset:14px;--pb-name-size:15px;--pb-preview-size:13px}#phiz-ba-trilingual .pb-row{gap:10px}#phiz-ba-trilingual .pb-search{margin-inline:14px;width:calc(100% - 28px)}#phiz-ba-trilingual .pb-brandmark{padding-inline:14px}}


#phiz-ba-trilingual{--pb-handle:light-dark(#ef8b00,#ffb54c);--pb-business-verified:#1ec45a}
#phiz-ba-trilingual .bt-language{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
#phiz-ba-trilingual .bt-language button{padding:7px 11px;border-radius:6px;font-size:12px;background:var(--pb-soft);color:var(--pb-sub)}
#phiz-ba-trilingual .bt-language button[aria-pressed=true]{background:var(--pb-text);color:var(--pb-bg)}
#phiz-ba-trilingual .pb-row{height:80px}
#phiz-ba-trilingual .pb-row-preview{display:block;text-overflow:ellipsis;overflow:hidden}
#phiz-ba-trilingual .pb-avatar.biz{background:var(--pb-bg)}
#phiz-ba-trilingual .pb-avatar.biz:after{display:none}
#phiz-ba-trilingual .bt-logo{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
#phiz-ba-trilingual .pb-verified{color:var(--pb-business-verified)}
#phiz-ba-trilingual .pb-verified svg{fill:var(--pb-business-verified);stroke:var(--pb-bg)}
#phiz-ba-trilingual .bt-handle{color:var(--pb-handle);font-size:14px;margin:4px 0}
#phiz-ba-trilingual .pb-chat-name>span{white-space:normal;max-width:none;font-size:14px;line-height:1.25}
#phiz-ba-trilingual .pb-chat-name small{font-size:11px}

#phiz-ba-trilingual .pb-identity{display:block;padding:15px;margin:0 2px;border-radius:15px;text-align:left;box-shadow:none}
#phiz-ba-trilingual .bt-id-top{display:flex;align-items:center;gap:10px}
#phiz-ba-trilingual .bt-id-top .pb-avatar{width:80px;height:80px;flex-shrink:0;margin:0}
#phiz-ba-trilingual .bt-id-top>div{min-width:0}
#phiz-ba-trilingual .pb-identity strong{font-size:14px;line-height:1.3}
#phiz-ba-trilingual .pb-identity small{margin:3px 0;font-size:11px;color:var(--pb-sub)}
#phiz-ba-trilingual .bt-service-description{font-size:12px;padding:12px 2px 13px;border-bottom:1px solid var(--pb-line);margin-top:5px}
#phiz-ba-trilingual .bt-capabilities{display:flex;gap:5px;flex-wrap:wrap;padding:8px 0}
#phiz-ba-trilingual .bt-capabilities span{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--pb-soft);color:var(--pb-sub)}
#phiz-ba-trilingual .bt-profile-pill{display:flex;justify-content:center;margin-top:5px}
#phiz-ba-trilingual .bt-profile-pill button{background:var(--pb-soft);color:var(--pb-text);border-radius:22px;padding:7px 15px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
#phiz-ba-trilingual .bt-profile-pill svg{width:16px;height:16px}
#phiz-ba-trilingual .bt-profile-page{background:var(--pb-soft);padding:0 14px 16px;flex:1}
#phiz-ba-trilingual .bt-profile-hero{text-align:center;padding:18px 6px 15px}
#phiz-ba-trilingual .bt-profile-hero .pb-avatar{width:108px;height:108px;margin:auto}
#phiz-ba-trilingual .bt-profile-hero h3{font-size:18px;line-height:1.3;margin:12px 0 4px;font-weight:500}
#phiz-ba-trilingual .bt-profile-quick{display:flex;gap:9px;margin-top:15px}
#phiz-ba-trilingual .bt-profile-quick button{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:24px;background:var(--pb-line);color:var(--pb-brand-strong);padding:10px 6px;flex:1;font-size:13px;font-weight:500}
#phiz-ba-trilingual .bt-profile-quick svg{width:17px;height:17px}
#phiz-ba-trilingual .bt-group{background:var(--pb-bg);border-radius:20px;overflow:hidden;margin:0 0 14px;padding:0 15px}
#phiz-ba-trilingual .bt-group-title{font-size:12px;padding:13px 0 4px;color:var(--pb-sub)}
#phiz-ba-trilingual .bt-group .pb-setting{padding:13px 0;min-height:49px;gap:12px;font-size:13px}
#phiz-ba-trilingual .bt-group .pb-setting:last-child{border-bottom:0}
#phiz-ba-trilingual .bt-group .pb-setting>svg:first-child{color:var(--pb-text);width:19px;height:19px}
#phiz-ba-trilingual .bt-group .pb-setting.danger>svg:first-child{color:var(--pb-danger)}
#phiz-ba-trilingual .bt-management-label{font-size:13px;font-weight:500;padding:3px 3px 9px}
#phiz-ba-trilingual .bt-business-description{display:flex;gap:12px;align-items:flex-start;padding:13px 0;font-size:12px}
#phiz-ba-trilingual .bt-business-description svg{width:19px;height:19px;flex-shrink:0}
#phiz-ba-trilingual .bt-minimal{background:var(--pb-card);border-radius:12px;margin:0 4px;padding:14px;font-size:12px;color:var(--pb-sub)}
#phiz-ba-trilingual .bt-format-choice{width:100%;margin:10px 0 0;border:1px solid var(--pb-line);border-radius:7px;background:var(--pb-bg);padding:7px;color:var(--pb-text);font-size:12px}
#phiz-ba-trilingual .bt-review-item{font-size:12px;padding:9px 0;border-bottom:1px solid var(--pb-line);color:var(--pb-sub)}
#phiz-ba-trilingual .bt-review-item strong{font-weight:500;color:var(--pb-text);display:block;margin-bottom:3px}
#phiz-ba-trilingual .bt-review-item code{color:var(--pb-brand-strong);font-size:11px}
#phiz-ba-trilingual .pb-note-list li{margin-bottom:9px}
#phiz-ba-trilingual .bt-status-note{font-size:11px;color:var(--pb-sub);padding:10px 14px}
#phiz-ba-trilingual .bt-search-name{white-space:normal;font-size:13px;line-height:1.3}
#phiz-ba-trilingual .pb-search .bt-search-name{font-size:13px}
#phiz-ba-trilingual .bt-history{padding:14px;background:var(--pb-chat);min-height:150px}
#phiz-ba-trilingual .bt-note-input{width:100%;padding:10px;background:var(--pb-soft);border:1px solid var(--pb-line);border-radius:8px;color:var(--pb-text);font:inherit}
#phiz-ba-trilingual .pb-setting .pb-setting-text{overflow-wrap:anywhere}
#phiz-ba-trilingual .pb-button{white-space:normal}
@media(max-width:620px){#phiz-ba-trilingual .pb-review-head{padding-right:72px}#phiz-ba-trilingual .pb-scenarios{gap:3px}#phiz-ba-trilingual .pb-scenarios button{padding:7px 9px;font-size:12px}}

#phiz-ba-trilingual .pb-row-preview{display:flex;gap:4px;align-items:center;min-width:0}
#phiz-ba-trilingual .pb-row-preview>span:last-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#phiz-ba-trilingual .pb-row-preview>i,#phiz-ba-trilingual .pb-row-preview>svg{flex-shrink:0;width:15px;height:15px}
#phiz-ba-trilingual .bt-name-kind{display:inline-flex;flex-shrink:0;color:var(--pb-sub)}
#phiz-ba-trilingual .bt-name-kind svg{width:14px;height:14px}
#phiz-ba-trilingual .bt-type-avatar{background:var(--pb-soft);color:var(--pb-sub)}
#phiz-ba-trilingual .bt-type-personal{background:light-dark(#eee3d8,#4e4035);color:light-dark(#675244,#eadaca)}
#phiz-ba-trilingual .bt-type-group{background:light-dark(#e0ebe1,#294b39);color:light-dark(#3d6950,#b8d9c3)}
#phiz-ba-trilingual .bt-type-channel{background:light-dark(#e2e8f5,#344363);color:light-dark(#4b6699,#c0d0ef)}
#phiz-ba-trilingual .bt-type-avatar svg{width:27px;height:27px}
#phiz-ba-trilingual .bt-muted-count{background:var(--pb-sub);color:var(--pb-bg)}
#phiz-ba-trilingual .bt-mention{width:18px;height:18px;border-radius:50%;background:var(--pb-brand);color:var(--pb-bg);font-size:12px;text-align:center;display:inline-flex;align-items:center;justify-content:center}
#phiz-ba-trilingual .bt-draft-label{color:var(--pb-danger);flex-shrink:0}
#phiz-ba-trilingual .bt-row-pinned{background:var(--pb-soft)}
#phiz-ba-trilingual .bt-type-summary{display:flex;align-items:center;gap:12px;margin:12px 0 16px}
#phiz-ba-trilingual .bt-type-summary strong{display:block;font-weight:500}
#phiz-ba-trilingual .bt-type-summary small{display:block;color:var(--pb-sub);margin-top:5px}
#phiz-ba-trilingual .bt-list-review{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--pb-line)}
#phiz-ba-trilingual .bt-list-review p{font-size:12px;color:var(--pb-sub);margin-top:7px;line-height:1.6}
#phiz-ba-trilingual .bt-list-review ul{margin:10px 0 0;padding-left:17px;font-size:12px;color:var(--pb-sub)}
#phiz-ba-trilingual .bt-list-review li{margin-bottom:7px}
#phiz-ba-trilingual .pb-row-name>.bt-name-kind:last-child{margin-left:2px}

#phiz-ba-trilingual .bt-context-overlay{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;gap:12px;padding:14px 12px 20px;background:light-dark(#ffffff70,#11111175);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);isolation:isolate}
#phiz-ba-trilingual .bt-context-dismiss{position:absolute;inset:0;z-index:0;width:100%;height:100%}
#phiz-ba-trilingual .bt-context-preview{background:var(--pb-bg);border-radius:18px;overflow:hidden;box-shadow:0 8px 28px var(--pb-shadow);flex-shrink:0;position:relative;z-index:1}

#phiz-ba-trilingual .bt-context-thread>*{flex-shrink:0}
#phiz-ba-trilingual .bt-context-thread .pb-bubble{font-size:14px;max-width:95%;margin:0;box-shadow:0 1px 3px var(--pb-shadow)}
#phiz-ba-trilingual .bt-context-thread .pb-bubble.out{max-width:86%}
#phiz-ba-trilingual .bt-context-thread .pb-bubble strong{font-weight:500;display:block;margin-bottom:6px}
#phiz-ba-trilingual .bt-context-thread .pb-message-card{width:100%}
#phiz-ba-trilingual .bt-preview-link{display:block;color:var(--pb-brand-strong);font-weight:500;margin-top:9px}
#phiz-ba-trilingual .bt-context-menu{background:var(--pb-bg);border-radius:15px;overflow:hidden;box-shadow:0 8px 28px var(--pb-shadow);width:78%;max-width:288px;position:relative;flex-shrink:0;z-index:1}
#phiz-ba-trilingual .bt-context-menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:44px;padding:12px 15px;text-align:left;color:var(--pb-text);font-size:14px;background:var(--pb-bg)}
#phiz-ba-trilingual .bt-context-menu button span{min-width:0;overflow-wrap:anywhere}
#phiz-ba-trilingual .bt-context-menu button svg{width:21px;height:21px;flex-shrink:0}
#phiz-ba-trilingual .bt-context-menu button:hover{background:var(--pb-soft)}
#phiz-ba-trilingual .bt-context-menu button.bt-context-danger{color:var(--pb-danger)}
#phiz-ba-trilingual .bt-context-source{margin:10px 0;color:var(--pb-sub);font-size:12px;line-height:1.6}
@media(max-width:360px){#phiz-ba-trilingual .bt-context-menu{width:88%}#phiz-ba-trilingual .bt-context-thread{height:248px}#phiz-ba-trilingual .bt-context-overlay{padding-inline:10px}}

#phiz-ba-trilingual .bt-security-notice{display:flex;align-items:flex-start;gap:7px;width:calc(100% - 18px);text-align:left;padding:10px 11px;margin:0 9px;font-size:12px;line-height:1.5;background:var(--pb-hint);color:var(--pb-text);border-radius:8px}
#phiz-ba-trilingual .bt-security-notice svg{width:16px;height:16px;margin-top:2px;flex-shrink:0}
#phiz-ba-trilingual .bt-chat-state-note{font-size:12px;text-align:center;color:var(--pb-sub);padding:0 9px}
#phiz-ba-trilingual .bt-profile-quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#phiz-ba-trilingual .bt-profile-quick:not(:has(button:nth-child(3))){grid-template-columns:repeat(2,minmax(0,1fr))}
#phiz-ba-trilingual .bt-profile-quick button{min-width:0;overflow-wrap:anywhere}
#phiz-ba-trilingual .bt-more-overlay{position:absolute;inset:0;z-index:14;display:flex;align-items:flex-end;background:light-dark(#0000004d,#00000077)}
#phiz-ba-trilingual .pb-phone:has(.bt-more-overlay) #pb-screen{position:static}
#phiz-ba-trilingual .bt-more-dismiss{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#phiz-ba-trilingual .bt-more-panel{position:relative;z-index:1;width:100%;padding:17px 17px 22px;border-radius:25px 25px 0 0;background:var(--pb-soft)}
#phiz-ba-trilingual .bt-more-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#phiz-ba-trilingual .bt-more-head .pb-avatar{width:39px;height:39px}
#phiz-ba-trilingual .bt-more-head strong{min-width:0;flex:1;font-size:16px;font-weight:500;overflow-wrap:anywhere}
#phiz-ba-trilingual .bt-more-close{border-radius:50%;background:var(--pb-line);width:36px;min-width:36px;height:36px;min-height:36px}
#phiz-ba-trilingual .bt-more-group,#phiz-ba-trilingual .bt-more-delete{background:var(--pb-bg);border-radius:19px;overflow:hidden}
#phiz-ba-trilingual .bt-more-delete{margin-top:15px}
#phiz-ba-trilingual .bt-more-row{display:flex;width:100%;gap:14px;align-items:center;text-align:left;padding:0 15px;min-height:53px;font-size:14px;background:var(--pb-bg)}
#phiz-ba-trilingual .bt-more-row>svg{width:22px;height:22px;flex-shrink:0}
#phiz-ba-trilingual .bt-more-row>span{flex:1;padding:17px 0;min-width:0;overflow-wrap:anywhere}
#phiz-ba-trilingual .bt-more-row+.bt-more-row>span{border-top:1px solid var(--pb-line)}
#phiz-ba-trilingual .bt-more-row.bt-more-danger{color:var(--pb-danger)}
#phiz-ba-trilingual .bt-attach-overlay{position:absolute;inset:0;z-index:13;display:flex;align-items:flex-end;padding:0 14px 72px}
#phiz-ba-trilingual .bt-attach-dismiss{position:absolute;inset:0;width:100%;height:100%;z-index:0}

<style id="business-card-v43-style">

<style id="meeting-v45-style">
#phiz-ba-trilingual .bt-receipt{display:inline-flex;align-items:center;color:#7c8581;flex:0 0 auto}
#phiz-ba-trilingual .bt-receipt.is-read{color:#2499e7}
#phiz-ba-trilingual .bt-receipt svg{width:17px;height:17px}
#phiz-ba-trilingual .bt-default-avatar{background:#e7ece9;color:#728078;display:inline-flex;align-items:center;justify-content:center}
#phiz-ba-trilingual .bt-default-avatar svg{width:50%;height:50%}
#phiz-ba-trilingual .bt-contact-form{display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:8px 2px}
#phiz-ba-trilingual .bt-contact-form>.pb-avatar{align-self:center}
#phiz-ba-trilingual .bt-contact-form>strong{text-align:center}
#phiz-ba-trilingual .bt-contact-form label{display:flex;flex-direction:column;gap:8px;font-size:13px;color:#526159}
#phiz-ba-trilingual .bt-contact-form input{width:100%;box-sizing:border-box;padding:12px;background:#f4f6f5;border:1px solid #dce3de;border-radius:12px;font:16px Arial,sans-serif;color:#17221b}
#phiz-ba-trilingual .bt-contact-form p{font-size:12px;line-height:1.5;color:#66736b}
#phiz-ba-trilingual .bt-contact-form [role=alert]{color:#c72d42}
#phiz-ba-trilingual .bt-voice-recorder{display:flex;flex-direction:column;gap:14px;align-items:center;padding:22px 0}
#phiz-ba-trilingual .bt-voice-recorder>svg{width:38px;height:38px;color:#00a85a}
#phiz-ba-trilingual .bt-meeting-controls,#phiz-ba-trilingual .bt-meeting-review{margin-top:20px;padding-top:16px;border-top:1px solid #e4e8e5;font:12px/1.65 Arial,'Microsoft YaHei',sans-serif;color:#526159}
#phiz-ba-trilingual .bt-meeting-controls label{display:flex;flex-direction:column;gap:5px;margin:10px 0}
#phiz-ba-trilingual .bt-meeting-controls select{width:100%;background:#fff;border:1px solid #e0e5e2;border-radius:9px;padding:10px;color:#263a2e;font:13px Arial,sans-serif}
#phiz-ba-trilingual .bt-meeting-review ul{padding-left:18px}
#phiz-ba-trilingual .bt-meeting-review li{margin-top:8px}
#phiz-ba-trilingual .bt-meeting-controls .bt-phiz-push{width:100%;margin:12px 0;box-sizing:border-box;text-align:left}
#phiz-ba-trilingual .bt-launching{display:flex;flex:1;flex-direction:column;gap:20px;align-items:center;justify-content:center;background:#fff;min-height:420px;color:#17221b;font:14px Arial,sans-serif}

</style>
<style id="composer-v47-style">
#phiz-ba-trilingual .bt-composer-shell{flex:0 0 auto;background:var(--pb-bg);width:100%}
#phiz-ba-trilingual .bt-composer-shell .pb-composer{display:flex;align-items:center;gap:5px;padding:7px 8px;background:var(--pb-soft);border-top:1px solid var(--pb-line)}
#phiz-ba-trilingual .bt-composer-shell .pb-inputwrap{display:flex;align-items:center;flex:1;min-width:0;border:1px solid var(--pb-line);border-radius:25px;background:var(--pb-bg);padding:1px 8px;gap:2px}
#phiz-ba-trilingual .bt-composer-shell .pb-inputwrap input{flex:1;width:0;min-width:0;min-height:42px;background:transparent;border:0;padding:4px 2px;font-size:16px}
#phiz-ba-trilingual .bt-composer-shell .pb-composer-tool{display:inline-flex;justify-content:center;align-items:center;width:30px;min-width:30px;min-height:42px;padding:0}
#phiz-ba-trilingual .bt-composer-shell .pb-composer-tool svg{width:23px;height:23px}
#phiz-ba-trilingual .bt-composer-shell .bt-composer-plus{width:30px;min-width:30px;height:44px;padding:0}
#phiz-ba-trilingual .bt-composer-shell .bt-composer-plus svg{width:29px;height:29px}
#phiz-ba-trilingual .bt-composer-shell .bt-composer-voice,#phiz-ba-trilingual .bt-composer-shell .pb-send{display:flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;min-width:44px;height:44px;padding:0;border-radius:50%;background:var(--pb-brand);color:#fff}
#phiz-ba-trilingual .bt-composer-shell .bt-composer-voice svg{width:25px;height:25px}
#phiz-ba-trilingual .bt-composer-panel{padding:16px 8px 22px;background:var(--pb-bg);border-top:1px solid var(--pb-line)}
#phiz-ba-trilingual .bt-composer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 3px}
#phiz-ba-trilingual .bt-composer-grid>button{display:flex;align-items:center;flex-direction:column;justify-content:flex-start;gap:8px;min-width:0;padding:2px;font-size:11px;line-height:1.35;color:var(--pb-sub);overflow-wrap:anywhere;text-align:center}
#phiz-ba-trilingual .bt-attachment-icon{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--pb-soft);color:var(--pb-text)}
