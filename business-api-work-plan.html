idade, consentimento/opt-out, modelos e resultados."],["Authentication | Mensagens de autenticação","Iniciativa futura, fase e datas a definir","Códigos de uso único (OTP) e verificações de segurança. Login, cadastro e recuperação de senha podem servir de exemplos."],["Jornadas de negócio","Proposta P3; aprovação separada","Selecionar demanda real entre agendamento, formulários, pedidos, pagamentos ou integrações; não construir tudo."],["Ciclo de vida da conta","Assistência P1 → produto P3","Provisionamento, revisão, configuração, ativação, suspensão, recuperação e auditoria; sem operações de gestão empresarial na fase 1."],["Modelos e controles","Base P1 → evolução P2","Configuração controlada, consentimento, pausa/retomada, bloqueio e denúncia; ampliar gestão e governança depois."]]],["Base de comunicação",[["IM / Conversation","P1; evolução contínua","Identidade, conversas, protocolos, roteamento, histórico, criptografia e recuperação entre dispositivos do App."],["Mídia e interação","P1 → conforme demanda","Upload/leitura, validação de formato/tamanho, botões, listas e carrosséis conforme especificação aprovada."],["Eventos e confiabilidade","P1; evolução contínua","Recibos, consulta de resultados, Webhook, idempotência, deduplicação e compensação; separar entrega de conclusão de negócio."]]],["Gestão e sustentação",[["Admin / Operações","Produto na P3","Gestão completa e auditoria; preparação técnica na P1, com denúncias atendidas por requisito de serviço separado."],["Segurança, qualidade e operação","Base P1 → ampliar P2/P4","Permissões, privacidade, denúncias, logs, monitoramento, incidentes e rollback; governança necessária antes de abrir marketing."],["Dados e validação comercial","Registro P1 → escala P4","Registrar valor, resultados, custos e disposição a pagar desde o piloto; dashboards e cobrança conforme evidências."]]]],"roadmap":{"title":"Roadmap de evolução da Business API","note":"Desenvolvimento, integração e validação com clientes da fase 2 em j rom ready customers.\nJan 2027 | Resolve pilot issues and standardize assisted integration.","Jan 2027 | Confirm marketing and governance rules, build and integrate the features, and run phase 1 regression checks.\nIn the same month, validate with eligible customers and record results and open issues.","Jan 2027 | Prepare the account-management design and initial scope.\nFeb | Begin developing account management in increments.\nMar | Continue development and integration, with acceptance of initial capabilities as ready. Schedule new journeys separately after approval.","Q1 2027 | Assess onboarding costs, reliability and customer usage.\nFrom Q2 | Decide on self-service, partner expansion and monetization investment."],"tasks":[["Deliver discovery, profiles, conversations and receiving controls in the App. H5 only guides downloads.","Integrate Service and Utility. Validate conversations, media, receipts and recovery.","Provide technically assisted credentials, authorization and callbacks for internal and external API calls. No enterprise access to the developer platform.","Backend engineers assist with creation, onboarding, permissions and configuration. Merchant-management operations and console are later scope.","Run integration checks, POCs, acceptance and rollback verification. Record customer value and onboarding and support costs."],["Show marketing messages in the App with separate consent and opt-out. Desktop remains for future assessment.","Add Marketing API, eligibility, template and opt-out checks, and send results.","Provide marketing API permissions, examples and callbacks to approved integrations. Review self-service access separately.","Use controlled configuration. Review template approval, quality monitoring and suspension mechanisms.","Validate successful sends, opt-out rejection, complaint handling and phase 1 regression before pilot."],["Synchronize profiles and states. Add forms, actions and results for approved journeys. Assess desktop separately.","Link account state to sending eligibility. Integrate approved business systems, callbacks and recovery.","Provide APIs, events and integration support for approved journeys.","Deliver ownership, provisioning, review, profiles, activation, suspension, recovery, permissions and audit in increments.","Verify consistency across App, API and Admin. Appointments, forms, orders and payments each need separate approval."],["Improve validated journeys based on usage and integration feedback.","Expand capacity, limits, isolation, monitoring and support as usage grows.","Assess self-service applications, configuration, diagnostics and partner onboarding.","Assess analytics, packages, metering and billing priorities.","Base investment on sustained usage, costs, willingness to pay and reliability."]],"dependencies":["Align App, IM, media and API contracts in November. Accept the agreed POC subset of scenarios and media.","Start the pilot after phase 1 stabilizes and marketing rules, opt-out and quality governance are approved.","Account management follows existing phase 3 scope. Each new journey needs a customer scenario, system, accountable owner and acceptance criteria.","Produce an investment decision in Q1. Self-service, billing and wider rollout depend on review."],"references":"Phase 4 is proposed. New phase 3 journeys require separate approval. Dates are indicative. Based on the 17 Nov 2026 Jira and PRD review and subsequent scope decisions.","diagram":[["User and business touchpoints",[["User App","P1 → P2/P3","Discovery, profile, conversations, messaging and controls; later marketing and approved business interactions."],["Desktop","Assess later","Excluded from phases 1 and 2; assess future demand without assuming a delivery date."],["Enterprise systems","P1 → P3","Existing agents/bots integrate through APIs; later ERP, appointment and order systems as justified."]]],["Integration and identity",[["API access and authorization","P1","Internal/external calls, credent eceipts, result queries, Webhook, idempotency, deduplication and compensation; distinguish delivery from business completion."]]],["Management and assurance",[["Admin / Operations","Productized in P3","Full account management and audit; technical preparation in P1, with reporting handled under its separate service requirement."],["Security, quality and operations","P1 foundation → P2/P4 enhancement","Permissions, privacy, reporting, logs, monitoring, incidents and rollback; required governance before marketing access."],["Data and commercial validation","P1 evidence → P4 scale","Record value, results, onboarding/support costs and willingness to pay from the pilot; build analytics and billing as justified."]]]],"roadmap":{"title":"Business API product roadmap","note":"Phase 2 development, integration and customer validation are scheduled for January 2027. Phase 3 development runs from February to March. Phase 2 validation depends on stable phase 1 flows. New phase 3 journeys need separate approval.","headers":["Phase","Nov–Dec 2026","Jan 2027","Feb","Mar","Q2 onward"],"rows":[["Integration, POC readiness and initial customer validation","Stabilize, complete remaining acceptance and standardize assisted onboarding","Operational support","Operational support","Expand onboarding based on pilot results"],["","Build, integrate and validate marketing with customers","","","Assess expansion based on validation"],["","Prepare management design and initial scope","Start account-management development","Continue development and integration. Accept initial capabilities as ready.","Complete account lifecycle and extend journeys as needed"],["","","","Consolidate usage, cost and commercial evidence","Review and advance self-service, partner expansion and monetization"]]},"authentication":{"title":"Authentication messaging","status":"Future workstream, phase and dates to be reviewed","description":"One-time passcodes (OTP) and security verification. Login, sign-up and password recovery are candidate scenarios.","boundary":"Phase 1 covers Service and controlled Utility. Authentication is a separate category, with its use cases, content and exceptions subject to dedicated review.","roadmap":"Validate demand and objectives before confirming the phase, pilot customers and delivery window.","tasks":["Evaluate code display, copy behavior and expiry messaging.","Define the API, eligibility, fixed content, expiry, resend and rate limits. Assign code generation and verification responsibilities.","Define access permissions, configuration, receipts and handling of sensitive data in logs.","Define pilot eligibility, template approval and rules for pausing sends.","Use login or password recovery cases to distinguish acceptance, delivery and successful verification. Test expiry and rate limits."]},"h5":"Separate auxiliary entry: H5 provides download guidance only, with no business operations.","flows":["User App ⇄ IM / Conversation ⇄ Business API ⇄ Enterprise agent / bot","Utility send → eligibility/template checks → IM delivery → App/interaction → callback"],"outcome":[["Operational business messaging channel validated by initial customers","Agreed acceptance, critical defects closed, effective controls, diagnosis and rollback available."],["Controlled proactive outreach product","Stable foundation, approved rules, correct opt-out/rejection and agreed quality conditions."],["Messaging plus selected business execution with standardized management","Consistent states, effective permissions/audit, traceable and accepted business actions."],["Repeatable, scalable and sustainable platform product","Expand based on reliability, costs, sustained usage and commercial evidence."]]}};
const modulePhases = [[[1,2,3],[],[1,3]],[[1,2],[4],[1,3]],[[1],[1],[2],[],[3],[1,3],[1,2]],[[1,2,3,4],[1],[1,2,3,4]],[[3],[1,2,3,4],[1,4]]];
const root = document.getElementById('ba-framework');
const content = root.querySelector('.content');
const languageButtons = [...root.querySelectorAll('[data-lang]')];
const escape = value => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
let language = 'zh';
let focus = 0;

function render(selectedLanguage) {
  language = Object.hasOwn(plan, selectedLanguage) ? selectedLanguage : 'zh';
  const data = plan[language];
  const [framework, choose, overview, delivery, workstream, milestones, acceptance, references, inFocus] = data.labels;
  const roadmap = data.roadmap;
  const authentication = data.authentication;
  root.lang = language === 'pt' ? 'pt-BR' : language;
  languageButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === language)));

  const phaseButtons = [overview, 'P1', 'P2', 'P3', 'P4'].map((name, id) =>
    `<button class="btn" type="button" data-phase="${id}" aria-pressed="false" aria-controls="ba-framework-map ba-framework-timeline ba-framework-work">${escape(name)}</button>`).join('');

  const layers = data.diagram.map(([title, modules], layer) => `
    <section class="layer"><h3>${escape(title)}</h3><div class="modules">
    ${modules.map(([name, stage, description], index) => `
      <article class="module" data-phases="${modulePhases[layer][index].join(' ')}">
        <strong>${escape(name)}</strong>
        <p class="phase-tag text-small">${escape(stage)}</p>
        <p class="text-small">${escape(description)}</p>
      </article>`).join('')}</div></section>`).join('');

  const roadmapRows = roadmap.rows.map((cells, i) => `
    <tr data-roadmap-row="${i + 1}"><th scope="row"><span class="phase-tag">P${i + 1}</span> ${escape(data.names[i])}</th>
    ${cells.map(cell => `<td>${escape(cell || '—')}</td>`).join('')}</tr>`).join('');

  function workstreamTable(tasks) {
    return `<table class="table table-sm map"><thead><tr><th scope="col">${escape(workstream)}</th><th scope="col">${escape(delivery)}</th></tr></thead>
      <tbody>${tasks.map((task, j) => `<tr><th scope="row">${escape(data.track[j])}</th><td>${escape(task)}</td></tr>`).join('')}</tbody></table>`;
  }

  const phases = data.names.map((name, i) => `
    <article class="phase-plan" data-plan="${i + 1}">
      <div class="stack"><p class="text-small phase-tag">P${i + 1} · ${escape(data.statuses[i])}</p><h3>${escape(name)}</h3><p>${escape(data.outcome[i][0])}</p></div>
      <div class="gates">
        <div class="stack"><strong>${escape(milestones)}</strong>${data.dates[i].split('\n').map(line => `<p class="text-small">${escape(line)}</p>`).join('')}</div>
        <div class="stack"><strong>${escape(acceptance)}</strong><p class="text-small">${escape(data.dependencies[i])}</p><p class="text-small">${escape(data.outcome[i][1])}</p></div>
      </div>
      ${workstreamTable(data.tasks[i])}
    </article>`).join('');

  content.innerHTML = `
    <div class="hero"><p class="brand text-small">PhizChat / Business API</p><h2>${escape(data.title)}</h2><p>${escape(data.intro)}</p></div>
    <section class="section" aria-labelledby="ba-framework-title">
      <div class="stack"><h3 id="ba-framework-title">${escape(framework)}</h3><p class="text-small text-muted focus-label">${escape(choose)}</p><div class="picker" role="group" aria-label="${escape(choose)}">${phaseButtons}</div><p class="text-small phase-tag" role="status"></p></div>
      <div class="architecture" id="ba-framework-map">${layers}</div>
      <div class="flow">${data.flows.map(line => `<p>${escape(line)}</p>`).join('')}<p class="text-small text-muted">${escape(data.h5)}</p></div>
    </section>
    <section class="section" aria-labelledby="ba-framework-roadmap">
      <div class="stack"><h3 id="ba-framework-roadmap">${escape(roadmap.title)}</h3><p class="text-small text-muted">${escape(roadmap.note)}</p></div>
      <div class="table-responsive roadmap-wrap" role="region" aria-labelledby="ba-framework-roadmap"><table class="table table-sm roadmap" id="ba-framework-timeline">
        <thead><tr>${roadmap.headers.map(header => `<th scope="col">${escape(header)}</th>`).join('')}</tr></thead><tbody>${roadmapRows}
          <tr><th scope="row">${escape(authentication.title)}</th><td colspan="5">${escape(authentication.status)} · ${escape(authentication.roadmap)}</td></tr>
        </tbody>
      </table></div>
    </section>
    <section class="section" id="ba-framework-work" aria-labelledby="ba-framework-delivery"><h3 id="ba-framework-delivery">${escape(delivery)}</h3><div class="phase-list">${phases}</div></section>
    <section class="phase-plan" id="ba-framework-auth"><div class="stack"><p class="phase-tag text-small">${escape(authentication.status)}</p><h3>${escape(authentication.title)}</h3><p>${escape(authentication.boundary)}</p></div>${workstreamTable(authentication.tasks)}</section>
    <div class="evidence"><strong>${escape(references)}</strong><p class="text-small text-muted">${escape(data.references)}</p><p class="text-small"><a href="https://phiz.atlassian.net/browse/PHIZ-2310" target="_blank" rel="noreferrer">Jira</a> · <a href="https://phiz.atlassian.net/wiki/spaces/CP/pages/861110328" target="_blank" rel="noreferrer">PRD</a> · <a href="https://phiz.atlassian.net/wiki/spaces/CP/pages/827850829/Business+API+PRD+Service+Utility" target="_blank" rel="noreferrer">Messaging PRD (Service + Utility)</a></p></div>`;

  const buttons = [...content.querySelectorAll('[data-phase]')];
  const modules = [...content.querySelectorAll('[data-phases]')];
  const workPlans = [...content.querySelectorAll('[data-plan]')];
  const roadmapItems = [...content.querySelectorAll('[data-roadmap-row]')];
  const announcement = content.querySelector('[role="status"]');
  function showPhase(phase) {
    focus = phase;
    buttons.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.phase) === phase)));
    modules.forEach(module => {
      const related = phase > 0 && module.dataset.phases.split(' ').includes(String(phase));
      module.classList.toggle('is-related', related);
    });
    workPlans.forEach(work => { work.hidden = phase > 0 && Number(work.dataset.plan) !== phase; });
    roadmapItems.forEach(row => row.classList.toggle('is-related', Number(row.dataset.roadmapRow) === phase));
    announcement.textContent = phase ? `${inFocus} · P${phase} ${data.names[phase - 1]}` : '';
    announcement.hidden = !phase;
  }
  buttons.forEach(button => button.addEventListener('click', () => showPhase(Number(button.dataset.phase))));
  showPhase(focus);
}

languageButtons.forEach(button => button.addEventListener('click', () => render(button.dataset.lang)));
render('zh');

})();
